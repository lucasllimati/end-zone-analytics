name: Atualizar dados e publicar

# Mantém o site no ar sem servidor:
#   - a cada 6 h: carga parcial dos dados → portão de qualidade → publica no Cloudflare se algo mudou
#   - a cada push na main: testes → build → publica a nova versão do código
#   - manual (aba Actions → "Run workflow"): carga parcial ou completa
on:
  schedule:
    - cron: '17 */6 * * *' # 00:17, 06:17, 12:17 e 18:17 UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de carga
        type: choice
        options: [partial, full]
        default: partial

permissions:
  contents: read

# Nunca duas publicações ao mesmo tempo; a próxima espera a atual terminar.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A primeira carga processa ~850 MB (estatísticas por jogo + play-by-play); as seguintes usam o cache de data-raw.
    timeout-minutes: 45
    # Segredos ficam só no passo que os usa: assim, scripts de instalação de dependências (npm ci)
    # e o restante do job nunca enxergam o token da Cloudflare.
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # O job não faz push: o token do Actions não precisa ficar gravado em .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Testes do código (só em push)
        if: github.event_name == 'push'
        run: npm run qa

      - name: Dependências sem vulnerabilidade alta (só em push)
        if: github.event_name == 'push'
        run: npm audit --omit=dev --audit-level=high

      - name: Restaurar dados da execução anterior
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data
            data-raw
          key: eza-data-${{ github.run_id }}
          restore-keys: eza-data-

      - name: Carga de dados
        id: data
        env:
          # Token automático do Actions: ~1.000 consultas/h à API do GitHub (evita o erro 403 do nflverse).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Entrada passada por variável (não interpolada no script): evita injeção de comandos.
          MODE: ${{ inputs.mode }}
        run: |
          before=$(node -p "try { require('./data/manifest.json').generatedAt } catch { '' }")
          if [ ! -f data/manifest.json ] || [ "$MODE" = "full" ]; then
            npm run data:full
          else
            npm run data:partial
          fi
          after=$(node -p "require('./data/manifest.json').generatedAt")
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Portão de qualidade (nada é publicado se falhar)
        run: npx vitest run tests/data/published.test.ts

      - name: Guardar dados para a próxima execução
        if: steps.data.outputs.changed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            data
            data-raw
          key: eza-data-${{ github.run_id }}

      - name: Build do site estático
        id: build
        if: steps.data.outputs.changed == 'true' || github.event_name != 'schedule'
        run: npm run build:static

      - name: Publicar no Cloudflare (Worker com static assets)
        id: deploy
        if: steps.build.outcome == 'success'
        # Usa o wrangler.jsonc da raiz: site em dist/ + placar ao vivo em worker/index.ts.
        # Versão exata (não "4"): uma versão nova comprometida não entra sozinha no deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.144.0 deploy

      - name: Resumo da execução
        if: always()
        run: node scripts/publish-summary.mjs "${{ steps.data.outputs.changed }}" "${{ steps.deploy.outcome == 'success' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Alerta no celular (opcional, ntfy)
        if: failure()
        env:
          # Opcional: URL de um tópico ntfy (https://ntfy.sh/<tópico>) para receber falhas no celular.
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          [ -n "$NTFY_URL" ] || exit 0
          curl -s -H "Title: End Zone Analytics - falha na publicacao" -H "Priority: high" -H "Tags: warning" \
            -d "A execucao ${{ github.run_number }} falhou. O site continua no ar com os dados anteriores. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$NTFY_URL"
