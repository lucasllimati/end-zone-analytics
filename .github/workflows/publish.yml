name: Atualizar dados e publicar

# Mantém o site no ar sem servidor:
#   - a cada 6 h: carga parcial dos dados → portão de qualidade → publica no Cloudflare se algo mudou
#   - a cada push na main: testes → build → publica a nova versão do código
#   - manual (aba Actions → "Run workflow"): carga parcial ou completa
on:
  schedule:
    - cron: '17 */6 * * *' # 00:17, 06:17, 12:17 e 18:17 UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Tipo de carga
        type: choice
        options: [partial, full]
        default: partial

permissions:
  contents: read

# Nunca duas publicações ao mesmo tempo; a próxima espera a atual terminar.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A primeira carga processa ~850 MB (estatísticas por jogo + play-by-play); as seguintes usam o cache de data-raw.
    timeout-minutes: 45
    # Segredos ficam só no passo que os usa: assim, scripts de instalação de dependências (npm ci)
    # e o restante do job nunca enxergam o token da Cloudflare.
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      # Opcional: token público do Cloudflare Web Analytics (medição sem cookies). Sem ele, nada é incluído.
      CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O job não faz push: o token do Actions não precisa ficar gravado em .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Testes do código (só em push)
        if: github.event_name == 'push'
        run: npm run qa

      - name: Dependências sem vulnerabilidade alta (só em push)
        if: github.event_name == 'push'
        run: npm audit --omit=dev --audit-level=high

      - name: Restaurar dados da execução anterior
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data
            data-raw
          key: eza-data-${{ github.run_id }}
          restore-keys: eza-data-

      - name: Carga de dados
        id: data
        env:
          # Token automático do Actions: ~1.000 consultas/h à API do GitHub (evita o erro 403 do nflverse).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Entrada passada por variável (não interpolada no script): evita injeção de comandos.
          MODE: ${{ inputs.mode }}
        run: |
          before=$(node -p "try { require('./data/manifest.json').generatedAt } catch { '' }")
          if [ ! -f data/manifest.json ] || [ "$MODE" = "full" ]; then
            npm run data:full
          else
            npm run data:partial
          fi
          after=$(node -p "require('./data/manifest.json').generatedAt")
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Portão de qualidade (nada é publicado se falhar)
        run: npx vitest run tests/data/published.test.ts

      - name: Guardar dados para a próxima execução
        if: steps.data.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data
            data-raw
          key: eza-data-${{ github.run_id }}

      - name: Build do site estático
        id: build
        if: steps.data.outputs.changed == 'true' || github.event_name != 'schedule'
        run: npm run build:static

      # O build estático real, servido pelo Worker local (wrangler dev): fluxos, acessibilidade, layout e visual.
      # Nas cargas agendadas o código não mudou, então os testes de navegador não rodam (o portão de qualidade sim).
      - name: Testes de navegador (E2E, acessibilidade, layout e visual)
        id: e2e
        if: steps.build.outcome == 'success' && github.event_name != 'schedule'
        env:
          E2E_STATIC: '1'
          E2E_BASE_URL: http://127.0.0.1:8788
          E2E_SERVER: npx --yes wrangler@4.144.0 dev --port 8788 --ip 127.0.0.1
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx playwright install --with-deps chromium
          # Na main, a aparência publicada vira a referência visual com que os pull requests são comparados.
          npx playwright test --update-snapshots=all

      - name: Relatório dos testes de navegador
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      # Só data/ (sem data-raw): é o que o CI dos pull requests precisa para os testes de navegador.
      - name: Guardar dados publicados para o CI
        if: steps.e2e.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: eza-site-data-${{ github.run_id }}

      - name: Guardar referência visual
        if: steps.e2e.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/e2e/__screenshots__/linux
          key: eza-visual-${{ github.run_id }}

      - name: Publicar no Cloudflare (Worker com static assets)
        id: deploy
        if: steps.build.outcome == 'success' && steps.e2e.outcome != 'failure'
        # Usa o wrangler.jsonc da raiz: site em dist/ + placar ao vivo em worker/index.ts.
        # Versão exata (não "4"): uma versão nova comprometida não entra sozinha no deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.144.0 deploy

      - name: Resumo da execução
        if: always()
        run: node scripts/publish-summary.mjs "${{ steps.data.outputs.changed }}" "${{ steps.deploy.outcome == 'success' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Alerta no celular (opcional, ntfy)
        if: failure()
        env:
          # Opcional: URL de um tópico ntfy (https://ntfy.sh/<tópico>) para receber falhas no celular.
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          [ -n "$NTFY_URL" ] || exit 0
          curl -s -H "Title: End Zone Analytics - falha na publicacao" -H "Priority: high" -H "Tags: warning" \
            -d "A execucao ${{ github.run_number }} falhou. O site continua no ar com os dados anteriores. Detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$NTFY_URL"
