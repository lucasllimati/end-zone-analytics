name: CI e deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sem data/ no CI, os testes de dados publicados são pulados; os demais rodam com fixtures.
      - run: npm run qa
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    # Ative criando a variável de repositório DEPLOY_ENABLED=true e os segredos SSH_HOST, SSH_USER e SSH_KEY.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency: production
    environment: production
    steps:
      - name: Publicar no servidor via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" 'cd ~/end-zone-analytics && bash deploy/update.sh'
