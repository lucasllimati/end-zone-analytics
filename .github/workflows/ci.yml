name: CI

# Testes em pull requests e em branches de trabalho. Pushes na main são testados e publicados por publish.yml.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O job não faz push: o token do Actions não precisa ficar gravado em .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sem data/ no CI, os testes de dados publicados são pulados; os demais rodam com fixtures.
      - run: npm run qa
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
