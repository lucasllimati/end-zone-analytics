name: CI

# Testes em pull requests e em branches de trabalho. Pushes na main são testados e publicados por publish.yml.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # O job não faz push: o token do Actions não precisa ficar gravado em .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sem data/ no CI, os testes de dados publicados são pulados; os demais rodam com fixtures.
      - run: npm run qa
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

      # Testes de navegador com os dados e a referência visual da main (caches gravados por publish.yml).
      # Pull requests podem ler os caches da branch base; sem dados, esta parte é pulada.
      - name: Restaurar dados da main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: eza-site-data-none
          restore-keys: eza-site-data-
      - name: Restaurar referência visual da main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/e2e/__screenshots__/linux
          key: eza-visual-none
          restore-keys: eza-visual-
      - name: Testes de navegador (E2E, acessibilidade, layout e visual)
        id: e2e
        env:
          E2E_STATIC: '1'
          E2E_BASE_URL: http://127.0.0.1:8788
          E2E_SERVER: npx --yes wrangler@4.144.0 dev --port 8788 --ip 127.0.0.1
          WRANGLER_SEND_METRICS: 'false'
        run: |
          [ -f data/manifest.json ] || { echo "Sem dados em cache: testes de navegador pulados."; exit 0; }
          npm run build:static
          npx playwright install --with-deps chromium
          # Sem referência visual (primeira execução), o teste visual fica de fora em vez de falhar.
          if [ -d tests/e2e/__screenshots__/linux ]; then npx playwright test --update-snapshots=none; else npx playwright test --grep-invert visual; fi
      - name: Relatório dos testes de navegador (diferenças visuais incluídas)
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
