name: CI

# Testes em pull requests e em branches de trabalho. Pushes na main são testados e publicados por publish.yml.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # O job não faz push: o token do Actions não precisa ficar gravado em .git/config.
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sem data/ no CI, os testes de dados publicados são pulados; os demais rodam com fixtures.
      - run: npm run qa
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
