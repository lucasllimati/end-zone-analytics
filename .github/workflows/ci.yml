name: CI

# Testes em pull requests e em branches de trabalho. Pushes na main são testados e publicados por publish.yml.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Sem data/ no CI, os testes de dados publicados são pulados; os demais rodam com fixtures.
      - run: npm run qa
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
