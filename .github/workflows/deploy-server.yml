name: Publicar no servidor próprio

# Só para quem usa o guia docs/PUBLICACAO_SERVIDOR.md.
# Ativação: variável de repositório DEPLOY_TARGET=server + segredos SSH_HOST, SSH_USER e SSH_KEY.
# Com DEPLOY_TARGET=server, o workflow do Cloudflare (publish.yml) fica desligado.
# No servidor, as cargas de dados rodam pelo agendador interno da aplicação; aqui só se publica o código.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.DEPLOY_TARGET == 'server'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes do código
        run: npm run qa
      - name: Publicar via SSH (deploy/update.sh)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" 'cd ~/end-zone-analytics && bash deploy/update.sh'
